<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My CSS Portfolio</title>
  <style>
    /* 1. Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    /* 2. Base styles (body, a, h1-h3, p) */
    body {
      font-family: sans-serif;
      line-height: 1.5;
      color: #1f2937;
    }
    a {
      text-decoration: none;
      color: inherit;
    }
    h1, h2, h3 {
      font-weight: bold;
    }
    p {
      font-size: 1rem;
    }

    /* 3. Navigation (.nav, .nav-logo, .nav-links, .nav-links a) */
    .nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background-color: #111827;
      color: white;
    }
    .nav-logo {
      font-size: 1.2rem;
      font-weight: bold;
    }
    .nav-links {
      display: flex;
      gap: 20px;
    }
    .nav-links a {
      color: white;
      font-size: 0.95rem;
    }
    .nav-links a:hover {
      color: #93c5fd;
    }

    /* 4. Hero section (.hero, .hero h1, .hero p, .btn) */
    .hero {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 80px 20px;
      background-color: #f3f4f6;
    }
    .hero h1 {
      font-size: 2.5rem;
      margin-bottom: 16px;
    }
    .hero p {
      font-size: 1.1rem;
      color: #4b5563;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #3b82f6;
      color: white;
      padding: 12px 28px;
      border-radius: 6px;
      font-weight: bold;
    }
    .btn:hover {
      background-color: #2563eb;
    }

    /* 5. Skills grid (.skills-section, .skills-grid, .skill-card) */
    .skills-section {
      padding: 60px 40px;
      text-align: center;
    }
    .skills-section h2 {
      font-size: 1.8rem;
      margin-bottom: 40px;
    }
    .skills-grid {
      display: flex;
      justify-content: center;
      gap: 24px;
      flex-wrap: wrap;
    }
    .skill-card {
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 30px 20px;
      width: 220px;
    }
    .skill-card h3 {
      margin-bottom: 10px;
      color: #3b82f6;
    }
    .skill-card p {
      font-size: 0.9rem;
      color: #6b7280;
    }

    /* 6. Footer (.footer) */
    .footer {
      text-align: center;
      padding: 24px;
      background-color: #111827;
      color: white;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <nav class="nav">
    <span class="nav-logo">MyPortfolio</span>
    <div class="nav-links">
      <a href="#skills">Skills</a>
      <a href="#contact">Contact</a>
    </div>
  </nav>

  <section class="hero">
    <h1>Hello, I am Learning CSS!</h1>
    <p>Week 3 · CSS Introduction · Gachon University</p>
    <a href="#skills" class="btn">See My Skills</a>
  </section>

  <section class="skills-section" id="skills">
    <h2>What I Know</h2>
    <div class="skills-grid">
      <div class="skill-card"><h3>HTML5</h3><p>Structure and semantics</p></div>
      <div class="skill-card"><h3>CSS3</h3><p>Styling and layout</p></div>
      <div class="skill-card"><h3>Flexbox</h3><p>Modern layout model</p></div>
    </div>
  </section>

  <footer class="footer">
    <p>K0126002 Web Programming &copy; 2026 Gachon University</p>
  </footer>
</body>
</html>
